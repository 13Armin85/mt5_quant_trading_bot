trading:
  mt5_time_zone: Europe/Helsinki # Observed LiteFinance server wall-clock timestamps; DST-aware. Use UTC for standard UTC APIs.
  mode: PAPER
  poll_seconds: 2
  risk_per_trade: 0.01
  max_total_risk: 0.01
  max_drawdown: 0.10
  max_positions: 3
  max_trades_per_day: 10
  max_spread_points: 40
  commission_per_lot: 7.0 # round trip, in account currency
  slippage_points: 20
  magic: 260912
  reconnect_attempts: 3
  reconnect_delay_seconds: 5
  max_daily_loss: 0.03
  max_weekly_loss: 0.06
  max_consecutive_losses: 3
  min_confidence: 0.70
  min_rr: 1.5
  preferred_rr: 2.0
  max_deviation_points: 20
  max_tick_age_seconds: 15
  allow_hedging: false
  duplicate_signal_ttl_minutes: 1440
  kill_switch_path: kill_switch.flag
  default_bars: 700
  paper_starting_balance: 10000
  correlation_threshold: 0.80
  max_correlated_positions: 1

news:
  enabled: true
  fail_closed: true
  block_before_minutes: 30
  block_after_minutes: 30
  stale_after_minutes: 60
  poll_seconds: 60
  timeout_seconds: 10
  provider: generic # generic JSON endpoint or tradingeconomics
  block_unknown_effect: true
  surprise_rules: [] # Optional explicit interpretation: {contains: ..., higher_is_positive: true/false}

strategy:
  family: ensemble # Compare all enabled rules on each completed candle. Explicit family selects that rule only.
  enabled_strategies: [trend_pullback, breakout, mean_reversion, momentum, ema_cross, macd_cross, ichimoku, supertrend, stochastic_reversal, cci_reversion, keltner_breakout, vwap_reclaim]
  selection:
    minimum_score: 0.65
    minimum_groups: 1 # Related rules share one group; increase to require cross-group confirmation.
    rule_weight: 0.70 # Remaining weight uses the existing technical component score.
    component_weights:
      regime_fit: 0.25
      higher_timeframes: 0.20
      oscillators: 0.15
      volume: 0.10
      price_confirmation: 0.10
      volatility: 0.10
      entry_trigger: 0.10
  stop_atr_multiple: 1.5
  breakout_lookback: 20
  pullback_atr: 0.5
  confidence_mode: RULE
  timeframes:
    macro: H4
    trend: H1
    setup: M15
    entry: M5
  weights:
    trend: 0.20
    structure: 0.20
    momentum: 0.15
    volume: 0.15
    price_action: 0.10
    volatility: 0.10
    news: 0.10
  indicators:
    ema_fast: 20
    ema_mid: 50
    ema_slow: 200
    rsi_period: 14
    adx_period: 14
    atr_period: 14
    bollinger_period: 20
    volume_sma_period: 20
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    stochastic_period: 14
    stochastic_smooth: 3
    cci_period: 20
    williams_period: 14
    roc_period: 12
    vwap_period: 20
    donchian_period: 20
    keltner_period: 20
    ichimoku_fast: 9
    ichimoku_base: 26
    ichimoku_span: 52
    supertrend_multiple: 3
  filters:
    max_spread_multiplier: 2.0
    min_adx_trending: 22
    min_relative_volume: 0.85

position_management:
  break_even_enabled: true
  break_even_trigger_r: 1.0
  trailing_enabled: true
  trailing_start_r: 1.5
  trailing_atr_multiple: 1.0
  partial_close_enabled: false
  partial_close_r: 1.5
  partial_close_fraction: 0.5

validation:
  minimum_trades: 200
  minimum_profit_factor: 1.30
  maximum_drawdown: 0.25
  require_positive_expectancy: true
  require_positive_oos: true
  require_calibration: true
