[theme]
base = "dark"
primaryColor = "#816BFF"
backgroundColor = "#090B12"
secondaryBackgroundColor = "#161824"
textColor = "#F5F5F8"
font = "Vazirmatn, sans-serif"
headingFont = "Vazirmatn, sans-serif"
baseFontSize = 14
baseFontWeight = 400
metricValueFontSize = "1.9rem"
metricValueFontWeight = 800

[[theme.fontFaces]]
family = "Vazirmatn"
url = "app/static/fonts/Vazirmatn.woff2"
weight = "100 900"
style = "normal"

[server]
enableXsrfProtection = true
enableCORS = true
enableStaticServing = true
